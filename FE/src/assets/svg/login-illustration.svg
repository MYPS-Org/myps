
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#051344;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#bg)" rx="8"/>
  
  <!-- Login form illustration -->
  <rect x="50" y="50" width="120" height="160" fill="white" opacity="0.1" rx="8"/>
  
  <!-- User icon -->
  <circle cx="110" cy="90" r="20" fill="white" opacity="0.3"/>
  <path d="M90 130 Q110 120 130 130 L130 150 L90 150 Z" fill="white" opacity="0.3"/>
  
  <!-- Security elements -->
  <rect x="220" y="80" width="140" height="100" fill="white" opacity="0.1" rx="4"/>
  <circle cx="290" cy="130" r="30" fill="white" opacity="0.2"/>
  <path d="M280 125 L285 130 L300 115" stroke="white" stroke-width="3" fill="none" opacity="0.4"/>
  
  <!-- Decorative elements -->
  <circle cx="80" cy="230" r="8" fill="white" opacity="0.2"/>
  <circle cx="320" cy="60" r="12" fill="white" opacity="0.15"/>
  <circle cx="350" cy="220" r="6" fill="white" opacity="0.3"/>
</svg>
